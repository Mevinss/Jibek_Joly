name: AI service tests
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: services/ai/requirements.txt
      - if: runner.os == 'macOS'
        run: brew install libomp
      - run: python -m pip install -r services/ai/requirements.txt
      - run: python -m pytest services/ai/tests -q
      - run: python -m services.ai.eval.run_agent_eval
        env:
          PYTHONIOENCODING: utf-8
